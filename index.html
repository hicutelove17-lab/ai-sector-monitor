<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 섹터 모니터</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#080c10; --surface:#0d1318; --border:#1a2430; --border-bright:#243040;
    --text:#e8edf2; --text-dim:#6b7f90; --text-muted:#3a4f60;
    --accent:#00d4ff; --accent-dim:rgba(0,212,255,0.1);
    --green:#00e5a0; --green-dim:rgba(0,229,160,0.12);
    --red:#ff4d6a; --red-dim:rgba(255,77,106,0.12);
    --font-mono:'DM Mono',monospace; --font-display:'Syne',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:var(--font-mono);min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.025) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
  .container{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:24px 16px;}
  header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  .header-left h1{font-family:var(--font-display);font-size:26px;font-weight:800;letter-spacing:-0.5px;}
  .header-left h1 span{color:var(--accent);}
  .header-sub{font-size:10px;color:var(--text-dim);margin-top:4px;letter-spacing:0.08em;text-transform:uppercase;}
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;}
  .last-updated{font-size:10px;color:var(--text-dim);}
  .refresh-btn{background:var(--accent-dim);border:1px solid var(--accent);color:var(--accent);font-family:var(--font-mono);font-size:11px;padding:7px 16px;cursor:pointer;letter-spacing:0.08em;text-transform:uppercase;transition:all 0.2s;}
  .refresh-btn:hover{background:var(--accent);color:var(--bg);}
  .refresh-btn:disabled{opacity:0.35;cursor:not-allowed;}
  .progress-bar{height:2px;background:var(--border);margin-bottom:18px;overflow:hidden;}
  .progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--green));transition:width 0.3s ease;}
  .status-bar{font-size:11px;padding:8px 14px;margin-bottom:18px;letter-spacing:0.04em;border:1px solid;display:none;}
  .status-bar.error{display:block;color:var(--red);border-color:var(--red);background:var(--red-dim);}
  .status-bar.info{display:block;color:var(--accent);border-color:var(--accent);background:var(--accent-dim);}
  .signal-banner{background:linear-gradient(135deg,rgba(0,212,255,0.04),rgba(167,139,250,0.04));border:1px solid var(--border-bright);padding:14px 18px;margin-bottom:22px;}
  .signal-title{font-family:var(--font-display);font-size:11px;font-weight:700;color:var(--accent);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px;}
  .signal-text{font-size:11px;color:var(--text-dim);line-height:1.75;}
  .signal-text strong{color:var(--accent);}
  .sector-tabs{display:flex;gap:3px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
  .sector-tabs::-webkit-scrollbar{display:none;}
  .tab{background:var(--surface);border:1px solid var(--border);color:var(--text-dim);font-family:var(--font-mono);font-size:11px;padding:7px 13px;cursor:pointer;white-space:nowrap;letter-spacing:0.05em;text-transform:uppercase;transition:all 0.15s;}
  .tab:hover{border-color:var(--border-bright);color:var(--text);}
  .tab.active{border-color:var(--accent);color:var(--accent);background:var(--accent-dim);}
  .sector-section{display:none;}
  .sector-section.active{display:block;}
  .sector-header{display:flex;align-items:center;gap:12px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);}
  .sector-icon{font-size:18px;}
  .sector-title{font-family:var(--font-display);font-size:15px;font-weight:700;}
  .sector-signal{font-size:10px;color:var(--accent);background:var(--accent-dim);border:1px solid rgba(0,212,255,0.2);padding:6px 12px;margin-bottom:14px;letter-spacing:0.03em;}
  .stocks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:10px;margin-bottom:28px;}
  .stock-card{background:var(--surface);border:1px solid var(--border);padding:14px;transition:border-color 0.2s,transform 0.15s;position:relative;overflow:hidden;}
  .stock-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--card-accent,var(--accent));transform:scaleX(0);transition:transform 0.25s;}
  .stock-card:hover{border-color:var(--border-bright);transform:translateY(-1px);}
  .stock-card:hover::before{transform:scaleX(1);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .ticker{font-family:var(--font-display);font-size:17px;font-weight:800;}
  .change-badge{font-size:10px;font-weight:500;padding:2px 7px;letter-spacing:0.04em;}
  .change-badge.up{background:var(--green-dim);color:var(--green);}
  .change-badge.down{background:var(--red-dim);color:var(--red);}
  .change-badge.flat{background:var(--border);color:var(--text-dim);}
  .company-name{font-size:10px;color:var(--text-dim);margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .price-row{display:flex;align-items:baseline;gap:5px;margin-bottom:10px;}
  .price{font-size:20px;font-weight:400;letter-spacing:-0.5px;}
  .price-change{font-size:11px;}
  .price-change.up{color:var(--green);}
  .price-change.down{color:var(--red);}
  .price-change.flat{color:var(--text-dim);}
  .card-meta{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:9px;border-top:1px solid var(--border);padding-top:8px;}
  .meta-item{display:flex;flex-direction:column;gap:2px;}
  .meta-label{color:var(--text-muted);letter-spacing:0.04em;text-transform:uppercase;}
  .meta-value{color:var(--text-dim);font-weight:500;}
  .skeleton-pulse{animation:pulse 1.5s ease-in-out infinite;color:var(--text-muted);}
  @keyframes pulse{0%,100%{opacity:0.25}50%{opacity:0.7}}

  /* News section */
  .news-section{margin-top:8px;}
  .news-title{font-family:var(--font-display);font-size:13px;font-weight:700;color:var(--text);margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--border);letter-spacing:0.02em;}
  .news-source{margin-bottom:16px;}
  .news-source-name{font-size:10px;color:var(--accent);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:6px;}
  .news-item{padding:8px 0;border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:3px;}
  .news-item:last-child{border-bottom:none;}
  .news-item a{font-size:11px;color:var(--text-dim);text-decoration:none;line-height:1.5;letter-spacing:0.02em;}
  .news-item a:hover{color:var(--text);}
  .news-date{font-size:9px;color:var(--text-muted);}

  footer{border-top:1px solid var(--border);padding-top:16px;margin-top:16px;font-size:10px;color:var(--text-muted);letter-spacing:0.03em;line-height:1.9;}
  @media(max-width:600px){.stocks-grid{grid-template-columns:1fr 1fr;}.price{font-size:17px;}header{flex-direction:column;}.header-right{align-items:flex-start;}}
  @media(max-width:360px){.stocks-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-left">
      <h1>AI <span>섹터</span> 모니터</h1>
      <div class="header-sub" id="sectorCount">로딩 중...</div>
    </div>
    <div class="header-right">
      <div class="last-updated" id="lastUpdated">데이터 로드 중...</div>
      <button class="refresh-btn" id="refreshBtn" onclick="startLoad()">⟳ 새로고침</button>
    </div>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="status-bar" id="statusBar"></div>

  <div class="signal-banner">
    <div class="signal-title">🔭 2026 AI 큰 그림</div>
    <div class="signal-text">
      GPU 학습 → 추론(Inference) 최적화 → 에이전틱 AI 응용 → <strong>디지털 바이올로지</strong>로 이동 중.
      전력 인프라가 AI의 진짜 병목. 지금은 인프라 확장기 막바지 + 추론·응용 초입부.
    </div>
  </div>

  <div class="sector-tabs" id="sectorTabs"></div>
  <div id="sectionsContainer"></div>

  <footer>
    ※ 데이터: Yahoo Finance 비공식 API (최대 15분 지연) · sectors.json 파일 수정으로 섹터·종목 추가·삭제 가능 · 투자 참고용
  </footer>
</div>

<script>
// ─── Config ───────────────────────────────────────────────
// Vercel API base URL (자동 감지)
const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://localhost:3000'
  : '';  // same domain on Vercel

let SECTORS = [];
let cache = {};
let currentTab = 0;
let newsCache = null;

// ─── Load sectors.json ────────────────────────────────────
async function loadSectors() {
  const r = await fetch('./sectors.json');
  SECTORS = await r.json();
}

// ─── Fetch quotes via Vercel API ──────────────────────────
async function fetchQuotes(tickers) {
  const sym = tickers.join(',');
  const r = await fetch(`${API_BASE}/api/quotes?symbols=${sym}`);
  const data = await r.json();
  Object.assign(cache, data.quotes ?? {});
}

// ─── Fetch news via Vercel API ────────────────────────────
async function fetchNews() {
  const r = await fetch(`${API_BASE}/api/news`);
  newsCache = await r.json();
}

// ─── Helpers ──────────────────────────────────────────────
const fmtPrice = n => n != null ? '$'+n.toFixed(2) : '--';
const fmtChange = n => n != null ? (n>=0?'+':'')+n.toFixed(2) : '--';
const fmtPct = n => n != null ? (n>=0?'+':'')+n.toFixed(2)+'%' : '--';
const fmtNum = n => n != null ? (n>=1000?(n/1000).toFixed(1)+'K':n.toFixed(2)) : '--';
function fmtVol(n) {
  if(n==null)return'--';
  if(n>=1e9)return(n/1e9).toFixed(1)+'B';
  if(n>=1e6)return(n/1e6).toFixed(1)+'M';
  if(n>=1e3)return(n/1e3).toFixed(0)+'K';
  return n;
}
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diff = Math.floor((Date.now() - d) / 60000);
  if (diff < 60) return diff+'분 전';
  if (diff < 1440) return Math.floor(diff/60)+'시간 전';
  return Math.floor(diff/1440)+'일 전';
}

// ─── Build card HTML ──────────────────────────────────────
function buildCard(ticker, name, color) {
  const d = cache[ticker];
  const dir = d ? (d.change > 0.005 ? 'up' : d.change < -0.005 ? 'down' : 'flat') : null;
  const priceColor = dir==='up'?'var(--green)':dir==='down'?'var(--red)':'var(--text)';
  return `<div class="stock-card" style="--card-accent:${color}">
    <div class="card-top">
      <div class="ticker">${ticker}</div>
      <div class="change-badge ${dir??'flat'}">${d ? fmtPct(d.changePct) : '--'}</div>
    </div>
    <div class="company-name">${name}</div>
    <div class="price-row">
      ${d
        ? `<div class="price" style="color:${priceColor}">${fmtPrice(d.price)}</div>
           <div class="price-change ${dir??'flat'}">${fmtChange(d.change)}</div>`
        : `<div class="price skeleton-pulse">---</div>`}
    </div>
    <div class="card-meta">
      <div class="meta-item"><div class="meta-label">고가</div><div class="meta-value">${d?'$'+fmtNum(d.high):'--'}</div></div>
      <div class="meta-item"><div class="meta-label">저가</div><div class="meta-value">${d?'$'+fmtNum(d.low):'--'}</div></div>
      <div class="meta-item"><div class="meta-label">거래량</div><div class="meta-value">${d?fmtVol(d.volume):'--'}</div></div>
    </div>
  </div>`;
}

// ─── Build news HTML ──────────────────────────────────────
function buildNews() {
  if (!newsCache?.news?.length) return '';
  const items = newsCache.news.map(src => {
    if (!src.items?.length) return '';
    const rows = src.items.map(item =>
      `<div class="news-item">
        <a href="${item.link}" target="_blank" rel="noopener">${item.title}</a>
        <div class="news-date">${timeAgo(item.date)}</div>
       </div>`
    ).join('');
    return `<div class="news-source">
      <div class="news-source-name">${src.source}</div>
      ${rows}
    </div>`;
  }).join('');
  return `<div class="news-section">
    <div class="news-title">📰 최신 뉴스 · 공시</div>
    ${items}
  </div>`;
}

// ─── Render ───────────────────────────────────────────────
function buildTabs() {
  const tabs = document.getElementById('sectorTabs');
  tabs.innerHTML = ['전체보기', ...SECTORS.map(s => s.icon+' '+s.title.split('—')[0].trim())]
    .map((label, i) => `<button class="tab ${i===0?'active':''}" onclick="switchTab(${i})">${label}</button>`)
    .join('');
}

function buildSections() {
  const container = document.getElementById('sectionsContainer');
  // section-0: all
  let allHTML = SECTORS.map(s => {
    const cards = s.tickers.map((t,i) => buildCard(t, s.names?.[i] ?? t, s.color)).join('');
    return `<div class="sector-header">
      <div class="sector-icon">${s.icon}</div>
      <div><div class="sector-title">${s.title}</div>
      <div style="font-size:10px;color:var(--text-dim);margin-top:2px">${s.signal}</div></div>
    </div>
    <div class="stocks-grid" style="margin-bottom:26px">${cards}</div>`;
  }).join('') + buildNews();

  let html = `<div id="section-0" class="sector-section active">${allHTML}</div>`;

  SECTORS.forEach((s, i) => {
    const cards = s.tickers.map((t,j) => buildCard(t, s.names?.[j] ?? t, s.color)).join('');
    html += `<div id="section-${i+1}" class="sector-section">
      <div class="sector-header">
        <div class="sector-icon">${s.icon}</div>
        <div><div class="sector-title">${s.title}</div></div>
      </div>
      <div class="sector-signal">📡 ${s.signal}</div>
      <div class="stocks-grid">${cards}</div>
      ${buildNews()}
    </div>`;
  });
  container.innerHTML = html;
}

function rerenderCurrentTab() {
  document.querySelectorAll('.sector-section').forEach((el,i) => el.classList.toggle('active', i===currentTab));
  buildSections();
  document.querySelectorAll('.sector-section').forEach((el,i) => el.classList.toggle('active', i===currentTab));
}

function switchTab(idx) {
  currentTab = idx;
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===idx));
  document.querySelectorAll('.sector-section').forEach((s,i) => s.classList.toggle('active', i===idx));
}

// ─── Main load ────────────────────────────────────────────
async function startLoad() {
  const btn = document.getElementById('refreshBtn');
  const fill = document.getElementById('progressFill');
  btn.disabled = true;
  fill.style.width = '5%';
  setStatus('데이터 로딩 중...', 'info');

  const allTickers = SECTORS.flatMap(s => s.tickers);
  const batches = [];
  for (let i=0; i<allTickers.length; i+=10) batches.push(allTickers.slice(i,i+10));

  let loaded = 0;
  for (const batch of batches) {
    try { await fetchQuotes(batch); } catch(e) {}
    loaded += batch.length;
    fill.style.width = Math.round((loaded/allTickers.length)*80)+'%';
    rerenderCurrentTab();
    await new Promise(r=>setTimeout(r,200));
  }

  fill.style.width = '90%';
  try { await fetchNews(); } catch(e) {}
  fill.style.width = '100%';
  rerenderCurrentTab();
  setTimeout(()=>{fill.style.width='0%';},800);

  const now = new Date();
  document.getElementById('lastUpdated').textContent =
    '업데이트: '+now.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});

  const count = Object.keys(cache).length;
  if (count === 0) {
    setStatus('⚠ 데이터 로드 실패', 'error');
  } else {
    setStatus('', '');
  }
  btn.disabled = false;
}

function setStatus(msg, type) {
  const el = document.getElementById('statusBar');
  if(!msg){el.style.display='none';return;}
  el.className=`status-bar ${type}`;
  el.textContent=msg;
}

// ─── Init ─────────────────────────────────────────────────
async function init() {
  await loadSectors();
  document.getElementById('sectorCount').textContent =
    `${SECTORS.length} Sectors · ${SECTORS.flatMap(s=>s.tickers).length} Stocks · ~15min delay`;
  buildTabs();
  buildSections();
  await startLoad();
}

// Auto-refresh every 3 minutes
setInterval(()=>{ if(!document.getElementById('refreshBtn').disabled) startLoad(); }, 180000);

init();
</script>
</body>
</html>
